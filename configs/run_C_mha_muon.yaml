# TinyLM — Run C (MHA + Muon) — HPC re-run, honest data (8B tokens, ~3 epochs)
run_name: run_C_mha_muon

# Ablation arm (locked — only attention + optimizer differ across A/B/C/D)
attention: mha
optimizer: muon

# Model architecture — LOCKED from docs/ablation_plan.md
n_layers: 18
d_model: 1024
n_heads: 16
d_latent: 512
d_rope: 64
ffn_hidden: 2816
ctx: 2048
vocab_size: 32000
tie_weights: true

# Data — overridden by TINYLM_SHARD_DIR on HPC (-> /scratch/$USER/tinylm/data)
shard_dir: data/shards
batch_size: 16          # 40GB starting micro-batch; confirm/adjust in smoke run
grad_accum_steps: 32    # effective batch = 16 * 32 = 512 (~1.05M tokens/step)
seq_len: 2048

# Training schedule: ~24B processed / 1.05M per step ≈ 23k steps (~3 epochs of 8B)
total_steps: 23000
warmup_steps: 2000

# Optimizer hyperparameters (locked)
lr_muon: 0.02
lr_adamw: 0.001
weight_decay: 0.1
grad_clip: 1.0

# Logging / checkpointing
log_every: 10
save_every: 100
wandb_project: tinylm

# Resume — set by hpc_job.sh via TINYLM_RESUME (-> checkpoints/last.pt)
resume_from: null

compile: true
use_bf16: true
grad_checkpoint: false
